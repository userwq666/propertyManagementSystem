spring.application.name=propertyManagementSystem

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/property_management_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 禁用 Spring Boot 内置 SQL 初始化（使用自定义 DatabaseInitializer）
spring.sql.init.mode=never

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt.secret=propertyManagementSystemSecretKeyForJwtTokenGeneration
jwt.expiration=86400000

# 端口配置
server.port=8080

# 日志配置 - 控制台输出SQL执行情况
logging.level.com.lsy.propertymanagementsystem.config.DatabaseInitializer=INFO
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.apache.ibatis=DEBUG