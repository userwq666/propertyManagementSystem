spring.application.name=propertyManagementSystem

# 鏁版嵁搴撻厤缃?spring.datasource.url=jdbc:mysql://localhost:3306/property_management_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 绂佺敤 Spring Boot 鍐呯疆 SQL 鍒濆鍖栵紙浣跨敤鑷畾涔?DatabaseInitializer锛?spring.sql.init.mode=never

# MyBatis-Plus閰嶇疆
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.type-enums-package=com.lsy.propertymanagementsystem.module

# JWT閰嶇疆
jwt.secret=propertyManagementSystemSecretKeyForJwtTokenGeneration
jwt.expiration=86400000

# 绔彛閰嶇疆
server.port=8080

# 鏃ュ織閰嶇疆 - 鎺у埗鍙拌緭鍑篠QL鎵ц鎯呭喌
logging.level.com.lsy.propertymanagementsystem.config.DatabaseInitializer=INFO
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.apache.ibatis=DEBUG
# 使用 Cookie 传递 Session ID，避免 jessessionid 出现在 URL 中
server.servlet.session.tracking-modes=COOKIE